services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: transcode
      POSTGRES_PASSWORD: transcode
      POSTGRES_DB: transcode
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U transcode -d transcode"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./api
    environment:
      DATABASE_URL: postgresql+psycopg://transcode:transcode@postgres:5432/transcode
      STORAGE_DIR: /data/storage
      SESSION_SECRET: dev-only-change-me
      COOKIE_SECURE: "0"
    ports:
      - "8000:8000"
    volumes:
      - storage:/data/storage
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  worker:
    build: ./worker
    environment:
      DATABASE_URL: postgresql+psycopg://transcode:transcode@postgres:5432/transcode
      STORAGE_DIR: /data/storage
    volumes:
      - storage:/data/storage
    depends_on:
      api:
        condition: service_healthy

  web:
    build: ./web
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres-data:
  storage: